name: Server Build & Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**'
      - '.github/workflows/server-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'server/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: arena_game
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: ./server
      run: dotnet restore

    - name: Build
      working-directory: ./server
      run: dotnet build --configuration Release --no-restore

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo 'waiting for postgres...'
          sleep 1
        done

    - name: Run migrations
      working-directory: ./server
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=arena_game;Username=postgres;Password=postgres"
      run: dotnet ef database update

    - name: Run tests
      working-directory: ./server
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=arena_game;Username=postgres;Password=postgres"
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish
      working-directory: ./server
      run: dotnet publish --configuration Release --output ./publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: server-build
        path: server/publish/

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/arena-server:latest
        file: ./server/Dockerfile
