name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-server:
    name: Build Dedicated Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          lfs: true
      
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Server-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Server-
            Library-
      
      - name: Build Server
        uses: game-ci/unity-builder@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: StandaloneLinux64
          buildName: SmallArena3D-Server
          buildsPath: builds
          buildMethod: BuildScripts.BuildServer
      
      - name: Upload Server Build
        uses: actions/upload-artifact@v3
        with:
          name: SmallArena3D-Server
          path: builds/StandaloneLinux64
  
  build-client:
    name: Build Client (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: StandaloneWindows64
            os: windows-latest
            build-name: SmallArena3D-Client-Windows
          - platform: StandaloneLinux64
            os: ubuntu-latest
            build-name: SmallArena3D-Client-Linux
          - platform: StandaloneOSX
            os: macos-latest
            build-name: SmallArena3D-Client-macOS
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          lfs: true
      
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.platform }}-
            Library-
      
      - name: Build Client
        uses: game-ci/unity-builder@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: ${{ matrix.platform }}
          buildName: ${{ matrix.build-name }}
          buildsPath: builds
          buildMethod: BuildScripts.BuildClient
      
      - name: Upload Client Build
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.build-name }}
          path: builds/${{ matrix.platform }}
  
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          lfs: true
      
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Tests-
            Library-
      
      - name: Run Unit Tests
        uses: game-ci/unity-test-runner@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: PlayMode
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport'
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: Test-Results
          path: artifacts
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: Coverage-Report
          path: CodeCoverage

  # Optional: Build documentation
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Check Documentation
        run: |
          echo "Checking documentation files..."
          test -f Documentation/PROTOCOL.md || exit 1
          test -f Documentation/CHEAT_TESTS.md || exit 1
          test -f Documentation/LOAD_TESTS.md || exit 1
          echo "All documentation files present!"
      
      - name: Generate Documentation Site
        run: |
          echo "Documentation validated successfully"
          # Add documentation generation tool here if needed
